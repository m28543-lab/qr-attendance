<meta charset="UTF-8">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f0ff;
    color: #333;
}

header {
    background: #5b2c83;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin-top: 8px;
    font-size: 17px;
}

.container {
    width: 90%;
    max-width: 600px;
    margin: 30px auto;
}

.box {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px #ccc;
}

h2 {
    color: #5b2c83;
}

input {
    width: 100%;
    padding: 14px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 17px;
    margin: 10px 0 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

.search {
    background: #5b2c83;
    color: white;
}

.search:hover {
    background: #472066;
}

.check {
    background: #28a745;
    color: white;
    margin-top: 15px;
}

.check:hover {
    background: #218838;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #f0e8ff;
    border-radius: 10px;
}

.result h3 {
    color: #5b2c83;
}

.result p {
    font-size: 17px;
}

.success {
    color: green;
    font-weight: bold;
}

</style>
</head>

<header>

    <h1>ระบบเช็คชื่อเข้าเรียน</h1>

    <p>ระบบเช็คชื่อเข้าเรียนด้วย QR Code</p>

</header>


<div class="container">

    <div class="box">

        <h2>📱 เช็คชื่อเข้าเรียน</h2>

        <p>กรอกรหัสนักเรียน</p>

        <input
            type="text"
            id="studentId"
            placeholder="กรอกรหัสนักเรียน"
        >

        <button
            class="search"
            onclick="searchStudent()"
        >
            🔎 ค้นหาข้อมูล
        </button>


        <div
            class="result"
            id="result"
        >

            <h3>ข้อมูลนักเรียน</h3>

            <p>
                เลขที่:
                <b id="showNumber"></b>
            </p>

            <p>
                รหัสนักเรียน:
                <b id="showId"></b>
            </p>

            <p>
                ชื่อ-นามสกุล:
                <b id="showName"></b>
            </p>

            <p>
                สถานะ:
                <b id="showStatus"></b>
            </p>


            <button
                class="check"
                onclick="checkIn()"
            >
                ✅ ยืนยันเช็คชื่อ
            </button>

        </div>

    </div>

let currentStudent = null;



/* ==============================
   ค้นหานักเรียน
   ============================== */

function searchStudent() {

    let id =
        document
        .getElementById("studentId")
        .value
        .trim();


    if (id === "") {

        alert("กรุณากรอกรหัสนักเรียน");

        return;
    }


    let student =
        students.find(function(item) {

            return item.id === id;

        });


    if (!student) {

        alert("ไม่พบรหัสนักเรียน");

        document
        .getElementById("result")
        .style.display = "none";

        return;
    }


    currentStudent = student;


    document
    .getElementById("showNumber")
    .innerText = student.number;


    document
    .getElementById("showId")
    .innerText = student.id;


    document
    .getElementById("showName")
    .innerText = student.name;


    document
    .getElementById("showStatus")
    .innerText = student.status;


    document
    .getElementById("result")
    .style.display = "block";

}



/* ==============================
   ยืนยันเช็คชื่อ
   ============================== */

function checkIn() {

    if (!currentStudent) {

        alert("กรุณาค้นหานักเรียนก่อน");

        return;
    }


    if (currentStudent.status === "มาเรียน") {

        alert("นักเรียนคนนี้เช็คชื่อแล้ว");

        return;
    }


    fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

            studentId: currentStudent.id

        })

    })


    .then(function(response) {

        return response.json();

    })


    .then(function(data) {


        if (data.success) {


            currentStudent.status = "มาเรียน";


            document
            .getElementById("showStatus")
            .innerText = "มาเรียน";


            alert(
                "เช็คชื่อสำเร็จ!\n\n" +
                "ชื่อ: " +
                currentStudent.name +
                "\nสถานะ: มาเรียน"
            );


            document
            .getElementById("studentId")
            .value = "";


            document
            .getElementById("result")
            .style.display = "none";


            currentStudent = null;


        } else {


            alert(
                "เกิดข้อผิดพลาด\n" +
                data.message
            );

        }

    })


    .catch(function(error) {

        console.log(error);

        alert(
            "ไม่สามารถเชื่อมต่อกับ Google Sheets ได้"
        );

    });

}
